<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Design Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .generator-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #5a6cf3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #5a6cf3;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .file-upload:hover, .file-upload.dragover {
            border-color: #5a6cf3;
            background: #f0f2ff;
        }

        .file-upload input {
            display: none;
        }

        .upload-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 14px;
            color: #999;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn {
            background: linear-gradient(135deg, #5a6cf3 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5a6cf3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .design-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .design-card:hover {
            transform: translateY(-5px);
        }

        .design-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .design-info h3 {
            color: #5a6cf3;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .design-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .design-prompt {
            font-style: italic;
            color: #777;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .design-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            text-decoration: none;
            border-radius: 6px;
            background: #28a745;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 10px;
            }
        }

        .emoji {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 Jewellery Design Generator</h1>
            <p>Create bespoke jewellery designs from text prompts or images</p>
        </div>

        <div class="two-column">
            <!-- Text Generation -->
            <div class="generator-section">
                <h2 class="section-title">
                    <span class="emoji">✨</span>
                    Generate from Text
                </h2>
                <form id="textForm">
                    <div class="form-group">
                        <label for="textPrompt">Design Description:</label>
                        <textarea id="textPrompt" placeholder="Describe your dream jewellery design... e.g., 'An elegant silver ring with a blue sapphire stone and intricate vine patterns'"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="textJewelleryType">Jewellery Type:</label>
                        <select id="textJewelleryType">
                            <option value="ring">Ring</option>
                            <option value="pendant">Pendant</option>
                            <option value="bracelet">Bracelet</option>
                            <option value="earring">Earrings</option>
                            <option value="necklace">Necklace</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Generate Design</button>
                </form>
                <div id="textLoading" class="loading">
                    <div class="spinner"></div>
                    <p>Creating your design...</p>
                </div>
            </div>

            <!-- Image Generation -->
            <div class="generator-section">
                <h2 class="section-title">
                    <span class="emoji">🎨</span>
                    Generate from Image
                </h2>
                <form id="imageForm">
                    <div class="form-group">
                        <label>Upload Image:</label>
                        <div class="file-upload" id="fileUpload">
                            <input type="file" id="imageFile" accept="image/*">
                            <div class="upload-text">Click to upload or drag & drop</div>
                            <div class="upload-hint">PNG, JPG up to 10MB</div>
                        </div>
                        <img id="imagePreview" class="preview-image" style="display: none;">
                    </div>
                    <div class="form-group">
                        <label for="imageJewelleryType">Jewellery Type:</label>
                        <select id="imageJewelleryType">
                            <option value="ring">Ring</option>
                            <option value="pendant">Pendant</option>
                            <option value="bracelet">Bracelet</option>
                            <option value="earring">Earrings</option>
                            <option value="necklace">Necklace</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="imagePrompt">Additional Description (optional):</label>
                        <input type="text" id="imagePrompt" placeholder="Any additional details...">
                    </div>
                    <button type="submit" class="btn" disabled>Generate Design</button>
                </form>
                <div id="imageLoading" class="loading">
                    <div class="spinner"></div>
                    <p>Processing your image...</p>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="alertContainer"></div>

        <!-- Designs Gallery -->
        <div class="generator-section">
            <h2 class="section-title">
                <span class="emoji">🏆</span>
                Your Designs
                <button onclick="refreshDesigns()" class="btn" style="margin-left: auto; padding: 8px 16px; font-size: 14px;">Refresh</button>
            </h2>
            <div id="designsGrid" class="designs-grid">
                <!-- Designs will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let selectedImageFile = null;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadDesigns();
        });

        function setupEventListeners() {
            // Text form submission
            document.getElementById('textForm').addEventListener('submit', handleTextSubmission);
            
            // Image form submission
            document.getElementById('imageForm').addEventListener('submit', handleImageSubmission);
            
            // File upload handling
            const fileUpload = document.getElementById('fileUpload');
            const fileInput = document.getElementById('imageFile');
            
            fileUpload.addEventListener('click', () => fileInput.click());
            fileUpload.addEventListener('dragover', handleDragOver);
            fileUpload.addEventListener('drop', handleDrop);
            fileInput.addEventListener('change', handleFileSelect);
        }

        async function handleTextSubmission(e) {
            e.preventDefault();
            
            const prompt = document.getElementById('textPrompt').value.trim();
            const jewelleryType = document.getElementById('textJewelleryType').value;
            
            if (!prompt) {
                showAlert('Please enter a design description', 'error');
                return;
            }
            
            const loadingEl = document.getElementById('textLoading');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            try {
                loadingEl.style.display = 'block';
                submitBtn.disabled = true;
                
                const response = await fetch('/api/generate-from-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        jewellery_type: jewelleryType
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const design = await response.json();
                showAlert('Design generated successfully!', 'success');
                loadDesigns();
                
                // Reset form
                document.getElementById('textForm').reset();
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('Failed to generate design. Please try again.', 'error');
            } finally {
                loadingEl.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        async function handleImageSubmission(e) {
            e.preventDefault();
            
            if (!selectedImageFile) {
                showAlert('Please select an image first', 'error');
                return;
            }
            
            const jewelleryType = document.getElementById('imageJewelleryType').value;
            const prompt = document.getElementById('imagePrompt').value;
            
            const loadingEl = document.getElementById('imageLoading');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            try {
                loadingEl.style.display = 'block';
                submitBtn.disabled = true;
                
                // Convert image to base64
                const base64Image = await fileToBase64(selectedImageFile);
                
                const response = await fetch('/api/generate-from-image', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image_data: base64Image,
                        jewellery_type: jewelleryType,
                        prompt: prompt
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const design = await response.json();
                showAlert('Design generated successfully!', 'success');
                loadDesigns();
                
                // Reset form
                document.getElementById('imageForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                selectedImageFile = null;
                updateUploadButton();
                
            } catch (error) {
                console.error('Error:', error);
                showAlert('Failed to generate design. Please try again.', 'error');
            } finally {
                loadingEl.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showAlert('Please select an image file', 'error');
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) { // 10MB
                showAlert('File size must be less than 10MB', 'error');
                return;
            }
            
            selectedImageFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            updateUploadButton();
        }

        function updateUploadButton() {
            const submitBtn = document.querySelector('#imageForm button[type="submit"]');
            submitBtn.disabled = !selectedImageFile;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function loadDesigns() {
            try {
                const response = await fetch('/api/designs');
                const designs = await response.json();
                
                const grid = document.getElementById('designsGrid');
                
                if (designs.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1 / -1;">No designs yet. Create your first design above!</p>';
                    return;
                }
                
                grid.innerHTML = designs.map(design => `
                    <div class="design-card">
                        <img src="${design.preview_url}" alt="${design.prompt}" class="design-image">
                        <div class="design-info">
                            <h3>${design.jewellery_type.charAt(0).toUpperCase() + design.jewellery_type.slice(1)}</h3>
                            <div class="design-meta">
                                Created: ${new Date(design.created_at).toLocaleDateString()}
                                ${design.source_type === 'image' ? ' • From Image' : ' • From Text'}
                            </div>
                            <div class="design-prompt">"${design.prompt}"</div>
                            <div class="design-actions">
                                ${design.model_url ? `<a href="${design.model_url}" download class="btn-small">Download 3D Model</a>` : ''}
                                <button onclick="deleteDesign('${design.id}')" class="btn-small btn-delete">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading designs:', error);
                showAlert('Failed to load designs', 'error');
            }
        }

        async function deleteDesign(designId) {
            if (!confirm('Are you sure you want to delete this design?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/designs/${designId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showAlert('Design deleted successfully', 'success');
                    loadDesigns();
                } else {
                    throw new Error('Failed to delete design');
                }
            } catch (error) {
                console.error('Error deleting design:', error);
                showAlert('Failed to delete design', 'error');
            }
        }

        function refreshDesigns() {
            loadDesigns();
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            container.appendChild(alert);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.parentNode.removeChild(alert);
                }
            }, 5000);
            
            // Scroll to alert
            alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
